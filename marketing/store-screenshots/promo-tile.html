<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif; background:#000; }

  /* Marketplace small promo tile: 440 x 280. */
  .tile {
    width:440px; height:280px; overflow:hidden; position:relative; color:#e6edf3;
    padding:30px 32px;
    background:
      radial-gradient(520px 300px at 8% -20%, rgba(52,168,83,.28), transparent 58%),
      radial-gradient(420px 260px at 118% 130%, rgba(31,111,235,.20), transparent 55%),
      linear-gradient(140deg,#0b0e14,#0d1117 62%);
    display:flex; flex-direction:column;
  }
  .brand { display:flex; align-items:center; gap:11px; }
  .logo { width:46px; height:46px; border-radius:12px; background:#34A853;
    display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(52,168,83,.45); flex-shrink:0; }
  .logo svg { width:27px; height:27px; fill:#fff; }
  .name { font-size:24px; font-weight:800; letter-spacing:-.02em; }
  .by { font-size:12px; color:#6e7681; margin-top:1px; }

  .headline { margin-top:20px; font-size:22px; font-weight:700; line-height:1.22; letter-spacing:-.01em; max-width:360px; }
  .headline b { color:#4ade80; }

  .chips { margin-top:auto; display:flex; gap:8px; align-items:center; }
  .chip { font-size:12px; font-weight:700; padding:4px 11px; border-radius:20px; }
  .c-present { color:#4ade80; background:rgba(74,222,128,.12); border:1px solid rgba(74,222,128,.3); }
  .c-late { color:#f59e0b; background:rgba(245,158,11,.13); border:1px solid rgba(245,158,11,.32); }
  .c-absent { color:#f85149; background:rgba(248,81,73,.12); border:1px solid rgba(248,81,73,.3); }
  .free { margin-left:auto; font-size:12px; font-weight:600; color:#8b949e; }
</style>
</head>
<body>
  <div class="tile" id="tile">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg></span>
      <div><div class="name">Attendance Tracker</div><div class="by">for Google Meet™ · by Kinetic Helix</div></div>
    </div>
    <div class="headline">Know <b>who attended</b> your Google Meet™ calls — then export to Sheets in one click.</div>
    <div class="chips">
      <span class="chip c-present">● Present</span>
      <span class="chip c-late">+ Late</span>
      <span class="chip c-absent">✕ No-show</span>
      <span class="free">Free</span>
    </div>
  </div>
</body>
</html>
