<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Tracker Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <img src="icons/icon-48.png" alt="" class="logo">
    <div>
      <div class="header-title">Attendance Tracker</div>
      <div class="header-sub">Official Google Meet Add-on</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      <span>🚀 How to Open in Google Meet:</span>
    </div>
    <ol class="steps">
      <li>Join or start any Google Meet call.</li>
      <li>Click the <strong>Activities icon</strong> (shapes) at the bottom right.</li>
      <li>Select <strong>Attendance Tracker</strong> &amp; press <strong>Start</strong>.</li>
    </ol>
  </div>

  <div class="btn-group">
    <button type="button" id="btn-open-meet" class="btn btn-primary">
      <span>Open Google Meet</span>
    </button>
    <button type="button" id="btn-open-marketplace" class="btn btn-secondary">
      <span>Install / View on Marketplace</span>
    </button>
    <button type="button" id="btn-open-history" class="btn btn-secondary">
      <span>View Meeting History Dashboard</span>
    </button>
  </div>

  <div class="footer">
    <a href="https://attendancetracker.dev" target="_blank" rel="noopener">attendancetracker.dev</a> ·
    <a href="https://attendancetracker.dev/privacy.html" target="_blank" rel="noopener">Privacy</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
