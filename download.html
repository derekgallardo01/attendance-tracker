<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Attendance Tracker — Download</title>
  <style>
    body { background: #0d1117; color: #e6edf3; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { text-align: center; padding: 32px; max-width: 380px; }
    .check { width: 44px; height: 44px; border-radius: 50%; background: rgba(74,222,128,.12); border: 1px solid rgba(74,222,128,.3); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; color: #4ade80; font-size: 22px; }
    h1 { font-size: 1.05rem; margin: 0 0 8px; }
    p { font-size: .82rem; color: #8b949e; line-height: 1.5; margin: 0; }
    a { color: #4ade80; }
  </style>
</head>
<body>
  <!-- Download relay for the Meet side panel. The add-on iframe's sandbox
       lacks allow-downloads (Chrome 83+ silently swallows anchor-click
       downloads inside it), so the panel stashes the file in localStorage
       (same origin) and opens this page in a top-level tab, where downloads
       work. Payload: attPendingDownload = { filename, mime, content,
       encoding: 'text' | 'base64' }. -->
  <div class="card">
    <div class="check" id="icon">⬇</div>
    <h1 id="headline">Starting your download…</h1>
    <p id="detail">If nothing happens, go back to the Meet panel and try again.</p>
  </div>
  <script>
    (function () {
      var headline = document.getElementById('headline');
      var detail = document.getElementById('detail');
      var icon = document.getElementById('icon');
      var done = false;

      function fail(title, msg) {
        if (done) return;
        headline.textContent = title;
        detail.textContent = msg;
      }

      function deliver(payload) {
        if (done || !payload || !payload.content) return;
        done = true;
        try {
          var parts;
          if (payload.encoding === 'base64') {
            var bin = atob(payload.content);
            var bytes = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            parts = [bytes];
          } else {
            parts = [payload.content];
          }
          var blob = new Blob(parts, { type: payload.mime || 'application/octet-stream' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = payload.filename || 'download';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
          icon.textContent = '✓';
          headline.textContent = 'Downloaded ' + (payload.filename || 'your file');
          detail.textContent = 'Check your browser’s Downloads. You can close this tab.';
        } catch (e) {
          done = false;
          fail('Download failed', 'Something went wrong preparing the file. Go back to the Meet panel and try again.');
        }
      }

      // Path 1: localStorage handoff. Works when the opener shares this
      // origin's storage (panel opened from a top-level page). Inside Meet,
      // Chrome's third-party storage partitioning gives the panel iframe a
      // SEPARATE localStorage, so this comes up empty there.
      try {
        var raw = localStorage.getItem('attPendingDownload');
        localStorage.removeItem('attPendingDownload');
        if (raw) { deliver(JSON.parse(raw)); if (done) return; }
      } catch (e) { /* storage blocked */ }

      // Path 2: postMessage handshake with the opener (the Meet panel).
      // Storage partitioning doesn't apply to postMessage. Only accept
      // payloads from our own origin.
      if (window.opener) {
        window.addEventListener('message', function (e) {
          if (e.origin !== window.location.origin) return;
          if (e.data && e.data.type === 'att-download') deliver(e.data);
        });
        try { window.opener.postMessage('att-download-ready', '*'); } catch (e) { /* opener gone */ }
        detail.textContent = 'Fetching the file from the Meet panel…';
        setTimeout(function () {
          if (!done) fail('Nothing to download', 'This page only works right after clicking a download button in the Meet panel. Go back and try again.');
        }, 10000);
      } else {
        fail('Nothing to download', 'This page only works right after clicking a download button in the Meet panel. Go back and try again.');
      }
    })();
  </script>
</body>
</html>
