<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Proposed replacement logo: roster clipboard + check badge on a green
       gradient. Distinct from the Google Meet camera glyph the old icon
       resembled (flagged in OAuth verification). -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15803d"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="url(#g)"/>
  <!-- clipboard -->
  <rect x="28" y="26" width="58" height="78" rx="10" ry="10" fill="white"/>
  <rect x="45" y="19" width="24" height="14" rx="6" ry="6" fill="#bbf7d0" stroke="white" stroke-width="4"/>
  <!-- roster rows: avatar dot + name bar -->
  <circle cx="41" cy="49" r="5.5" fill="#16a34a"/>
  <rect x="51" y="45" width="27" height="8" rx="4" fill="#bbf7d0"/>
  <circle cx="41" cy="68" r="5.5" fill="#16a34a"/>
  <rect x="51" y="64" width="27" height="8" rx="4" fill="#bbf7d0"/>
  <circle cx="41" cy="87" r="5.5" fill="#16a34a"/>
  <rect x="51" y="83" width="27" height="8" rx="4" fill="#bbf7d0"/>
  <!-- check badge -->
  <circle cx="92" cy="88" r="25" fill="#14532d" stroke="white" stroke-width="5"/>
  <path d="M80 88 l9 10 l16 -19" stroke="white" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
